---
name: build

on:
  push:
    branches: [master]
  pull_request:

# A push to a branch with an open pull request would otherwise start two identical matrices.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14"]

    # The tests load skimage.data.cells3d, which scikit-image downloads from gitlab.com.
    # A fixed data folder lets actions/cache keep the file, so a gitlab.com outage
    # does not fail the run.
    env:
      SKIMAGE_DATADIR: ${{ github.workspace }}/.skimage-data

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yaml
          # Without this the matrix entry is decorative: the environment file wins and the job
          # name reports a python version the job does not actually use.
          create-args: python=${{ matrix.python-version }}

      - name: Install package
        shell: bash -l {0}
        run: pip install -e .

      # scikit-image stores its data in a subfolder per version. The cache key follows
      # the version, so an upgrade does not restore a stale folder.
      - name: Get scikit-image version
        id: skimage
        shell: bash -l {0}
        run: echo "version=$(python -c 'import skimage; print(skimage.__version__, end="")')" >> "$GITHUB_OUTPUT"

      - name: Cache scikit-image data
        uses: actions/cache@v6
        with:
          path: ${{ env.SKIMAGE_DATADIR }}
          key: skimage-data-${{ runner.os }}-${{ steps.skimage.outputs.version }}

      - name: Run tests
        shell: bash -l {0}
        run: python -m unittest discover -s test -v
