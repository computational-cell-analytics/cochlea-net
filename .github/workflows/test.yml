---
name: build

on:
  push:
    branches: [master]
  pull_request:

# A push to a branch with an open pull request would otherwise start two identical matrices.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yaml
          # Without this the matrix entry is decorative: the environment file wins and the job
          # name reports a python version the job does not actually use.
          create-args: python=${{ matrix.python-version }}

      - name: Install package
        shell: bash -l {0}
        run: pip install -e .
      
      - name: Run tests
        shell: bash -l {0}
        run: python -m unittest discover -s test -v
