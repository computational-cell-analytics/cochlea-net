---
name: build

on:
  push:
    branches: [master]
  pull_request:

# A push to a branch with an open pull request would otherwise start two identical matrices.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # A job takes less than 10 minutes. Without a limit, a hanging download blocks the runner for 6 hours.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14"]

    # The tests download skimage.data.cells3d from gitlab.com and a test segmentation from owncloud.
    # Fixed data folders let actions/cache keep the files, so an outage of these servers
    # does not fail the run.
    env:
      SKIMAGE_DATADIR: ${{ github.workspace }}/.skimage-data
      COCHLEA_NET_CACHE_DIR: ${{ github.workspace }}/.cochlea-net-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yaml
          # Without this the matrix entry is decorative: the environment file wins and the job
          # name reports a python version the job does not actually use.
          create-args: python=${{ matrix.python-version }}

      - name: Install package
        shell: bash -l {0}
        run: pip install -e .

      # scikit-image stores its data in a subfolder per version, and test_data.py pins the
      # test segmentation. The cache key follows both, so a change does not restore stale files.
      - name: Get scikit-image version
        id: skimage
        shell: bash -l {0}
        run: echo "version=$(python -c 'import skimage; print(skimage.__version__, end="")')" >> "$GITHUB_OUTPUT"

      - name: Cache test data
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.SKIMAGE_DATADIR }}
            ${{ env.COCHLEA_NET_CACHE_DIR }}/test_data
          key: test-data-${{ runner.os }}-skimage-${{ steps.skimage.outputs.version }}-${{ hashFiles('flamingo_tools/test_data.py') }}

      - name: Run tests
        shell: bash -l {0}
        run: python -m unittest discover -s test -v
